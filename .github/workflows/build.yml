name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Make Android app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp index.html www/
          cp logo.png www/
          npx cap init "Nepali Village Game" com.nepalivillage.game --web-dir www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Make app full screen
        run: |
          cat > android/app/src/main/java/com/nepalivillage/game/MainActivity.java << 'EOF'
          package com.nepalivillage.game;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }

            private void hideBars() {
              Window window = getWindow();
              WindowCompat.setDecorFitsSystemWindows(window, false);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = window.getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                window.setAttributes(lp);
              }
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(window, window.getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF

      - name: Make app icon from logo
        run: |
          cd android/app/src/main/res
          sed -i 's/#FFFFFF/#000000/' values/ic_launcher_background.xml
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d s f <<< "$spec"
            convert "$GITHUB_WORKSPACE/logo.png" -resize ${s}x${s} -background black -gravity center -extent ${s}x${s} mipmap-$d/ic_launcher.png
            cp mipmap-$d/ic_launcher.png mipmap-$d/ic_launcher_round.png
            inner=$((f*60/100))
            convert "$GITHUB_WORKSPACE/logo.png" -resize ${inner}x${inner} -background black -gravity center -extent ${f}x${f} mipmap-$d/ic_launcher_foreground.png
          done

      - name: Sync and build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
