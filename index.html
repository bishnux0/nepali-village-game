<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nepali Village Game</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;touch-action:none}
#btns{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px}
.grp{display:flex;gap:10px}
.b{width:80px;height:80px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:32px;border:none;user-select:none;-webkit-user-select:none}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center}
#splash img{width:92%;max-width:500px;height:auto}
#start{margin-top:40px;padding:16px 50px;font-size:26px;font-weight:bold;color:#fff;background:#0a84ff;border:none;border-radius:12px}
</style>
</head>
<body>
<div id="splash">
  <img src="logo.png" alt="Nepali Car Game">
  <button id="start">START</button>
</div>

<div id="btns">
  <div class="grp"><button class="b" id="left">◀</button><button class="b" id="right">▶</button></div>
  <div class="grp"><button class="b" id="brake">▼</button><button class="b" id="gas">▲</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- Start screen ----
document.getElementById('start').addEventListener('click', function () {
  document.getElementById('splash').style.display = 'none';
});

// ---- Scene setup ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(50, 100, 50);
scene.add(sun);

// ---- Ground and road ----
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshLambertMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 500),
  new THREE.MeshLambertMaterial({ color: 0x555555 })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.05;
scene.add(road);

// ---- Village houses ----
function makeHouse(x, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(6, 4, 6),
    new THREE.MeshLambertMaterial({ color: 0xd2b48c })
  );
  body.position.y = 2;
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(5, 3, 4),
    new THREE.MeshLambertMaterial({ color: 0xb22222 })
  );
  roof.position.y = 5.5;
  roof.rotation.y = Math.PI / 4;
  g.add(body, roof);
  g.position.set(x, 0, z);
  scene.add(g);
}

// ---- Trees ----
function makeTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.5, 3),
    new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
  );
  trunk.position.y = 1.5;
  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2, 8, 8),
    new THREE.MeshLambertMaterial({ color: 0x2e7d32 })
  );
  leaves.position.y = 4.5;
  g.add(trunk, leaves);
  g.position.set(x, 0, z);
  scene.add(g);
}

for (let z = -200; z <= 200; z += 30) {
  makeHouse(-16, z);
  makeHouse(18, z + 12);
  makeTree(-10, z + 10);
  makeTree(10, z - 8);
}

// ---- Mountains far away ----
for (let i = 0; i < 12; i++) {
  const m = new THREE.Mesh(
    new THREE.ConeGeometry(40, 80, 6),
    new THREE.MeshLambertMaterial({ color: 0x6b7b8c })
  );
  const a = (i / 12) * Math.PI * 2;
  m.position.set(Math.cos(a) * 280, 40, Math.sin(a) * 280);
  scene.add(m);
}

// ---- Car ----
const car = new THREE.Group();
const carBody = new THREE.Mesh(
  new THREE.BoxGeometry(2, 1, 4),
  new THREE.MeshLambertMaterial({ color: 0xe53935 })
);
carBody.position.y = 0.8;
const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 0.8, 2),
  new THREE.MeshLambertMaterial({ color: 0x90caf9 })
);
cabin.position.set(0, 1.6, -0.2);
car.add(carBody, cabin);
scene.add(car);

// ---- Controls ----
const keys = {};
function bind(id, name) {
  const el = document.getElementById(id);
  ['touchstart', 'mousedown'].forEach(t =>
    el.addEventListener(t, e => { e.preventDefault(); keys[name] = true; }));
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(t =>
    el.addEventListener(t, e => { e.preventDefault(); keys[name] = false; }));
}
bind('left', 'left');
bind('right', 'right');
bind('gas', 'gas');
bind('brake', 'brake');

// ---- Game loop ----
let speed = 0;
let angle = 0;

function loop() {
  requestAnimationFrame(loop);

  if (keys.gas) speed += 0.01;
  else if (keys.brake) speed -= 0.015;
  else speed *= 0.98;
  speed = Math.max(-0.2, Math.min(0.5, speed));

  if (Math.abs(speed) > 0.01) {
    const dir = Math.sign(speed);
    if (keys.left) angle += 0.03 * dir;
    if (keys.right) angle -= 0.03 * dir;
  }

  car.rotation.y = angle;
  car.position.x += Math.sin(angle) * speed;
  car.position.z += Math.cos(angle) * speed;
  car.position.x = Math.max(-240, Math.min(240, car.position.x));
  car.position.z = Math.max(-240, Math.min(240, car.position.z));

  camera.position.set(
    car.position.x - Math.sin(angle) * 10,
    5,
    car.position.z - Math.cos(angle) * 10
  );
  camera.lookAt(car.position.x, 1, car.position.z);

  renderer.render(scene, camera);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
